services:
  portainer:
    image: portainer/portainer-ce:2.45.0
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/server/apps/portainer/data:/data
    expose:
      - "9000"
    networks:
      - proxy

networks:
  proxy:
    name: nginx_proxy
    external: true
